<svg width="100%" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Diagrama de Sequência — Autenticação JWT</title>
  <desc>Fluxo completo de autenticação JWT, do formulário de login até a validação do token no back-end</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    text { font-family: sans-serif; fill: #1a1a1a; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; }
    .actor-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
    .actor-teal text { fill: #085041; }
    .actor-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .actor-purple text { fill: #3C3489; }
    .actor-coral rect { fill: #FAECE7; stroke: #993C1D; }
    .actor-coral text { fill: #712B13; }
    .box-coral rect { fill: #FAECE7; stroke: #993C1D; }
    .box-coral text { fill: #712B13; }
    .box-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .box-purple text { fill: #3C3489; }
  </style>

  <!-- Atores -->
  <g class="actor-teal">
    <rect x="40" y="20" width="120" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="100" y="47" text-anchor="middle">Usuário</text>
  </g>
  <g class="actor-purple">
    <rect x="240" y="20" width="140" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="310" y="47" text-anchor="middle">Front-end (JS)</text>
  </g>
  <g class="actor-coral">
    <rect x="460" y="20" width="140" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="530" y="47" text-anchor="middle">Back-end (API)</text>
  </g>

  <!-- Linhas de vida -->
  <line x1="100" y1="64" x2="100" y2="590" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="310" y1="64" x2="310" y2="590" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="530" y1="64" x2="530" y2="590" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 1. Usuário preenche formulário -->
  <line x1="100" y1="105" x2="295" y2="105" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text class="ts" x="195" y="98" text-anchor="middle">1. Preenche CPF e senha</text>

  <!-- 2. Fetch POST /auth/login -->
  <line x1="310" y1="145" x2="515" y2="145" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text class="ts" x="412" y="138" text-anchor="middle">2. POST /auth/login</text>

  <!-- 3. Busca no banco -->
  <g class="box-coral">
    <rect x="490" y="162" width="80" height="30" rx="6" stroke-width="0.5"/>
    <text class="ts" x="530" y="181" text-anchor="middle">Busca no BD</text>
  </g>

  <!-- 4. Verifica bcrypt -->
  <g class="box-coral">
    <rect x="490" y="202" width="80" height="30" rx="6" stroke-width="0.5"/>
    <text class="ts" x="530" y="221" text-anchor="middle">Verifica bcrypt</text>
  </g>

  <!-- 5. Gera JWT -->
  <g class="box-coral">
    <rect x="490" y="242" width="80" height="30" rx="6" stroke-width="0.5"/>
    <text class="ts" x="530" y="261" text-anchor="middle">Gera JWT</text>
  </g>

  <!-- 6. Retorna tokens -->
  <line x1="515" y1="290" x2="325" y2="290" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text class="ts" x="412" y="283" text-anchor="middle">3. { accessToken, refreshToken }</text>

  <!-- 7. Salva localStorage -->
  <g class="box-purple">
    <rect x="250" y="307" width="120" height="30" rx="6" stroke-width="0.5"/>
    <text class="ts" x="310" y="326" text-anchor="middle">Salva localStorage</text>
  </g>

  <!-- 8. Redireciona -->
  <line x1="310" y1="355" x2="115" y2="355" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text class="ts" x="210" y="348" text-anchor="middle">4. Redireciona → dashboard</text>

  <!-- Divisor -->
  <line x1="40" y1="385" x2="640" y2="385" stroke="#ccc" stroke-width="0.5" stroke-dasharray="6 4"/>
  <text class="ts" x="340" y="400" text-anchor="middle" fill="#888">Requisição autenticada (rota protegida)</text>

  <!-- 9. Requisição com token -->
  <line x1="310" y1="420" x2="515" y2="420" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text class="ts" x="412" y="413" text-anchor="middle">5. GET /me + Bearer token</text>

  <!-- 10. autenticar() -->
  <g class="box-coral">
    <rect x="490" y="437" width="80" height="30" rx="6" stroke-width="0.5"/>
    <text class="ts" x="530" y="456" text-anchor="middle">autenticar()</text>
  </g>

  <!-- 11. Token válido -->
  <g class="box-coral">
    <rect x="490" y="477" width="80" height="30" rx="6" stroke-width="0.5"/>
    <text class="ts" x="530" y="496" text-anchor="middle">Token válido</text>
  </g>

  <!-- 12. Retorna dados -->
  <line x1="515" y1="525" x2="325" y2="525" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text class="ts" x="412" y="518" text-anchor="middle">6. { id, cpf, nome, email }</text>

  <!-- 13. Exibe dados -->
  <line x1="310" y1="560" x2="115" y2="560" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text class="ts" x="210" y="553" text-anchor="middle">7. Exibe dados ao usuário</text>
</svg>
